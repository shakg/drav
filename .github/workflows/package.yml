name: Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: 6.8.3

jobs:
  deb-ubuntu-24-04:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Skia's system libraries, GL, and the runtime libraries of the bundled Qt plugins
          # (dpkg-shlibdeps must find every library they link).
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libfontconfig-dev libfreetype-dev libharfbuzz-dev libicu-dev libpng-dev libjpeg-turbo8-dev \
            libwebp-dev libexpat1-dev zlib1g-dev libgl-dev libegl-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-sync1 libxcb-xfixes0 \
            libx11-xcb1 libsm6 libice6 libgbm1 libdrm2 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libdbus-1-3 libgtk-3-0t64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Cache Skia
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: |
            third_party/skia
            !third_party/skia/.git
          key: skia-ubuntu-24.04-${{ hashFiles('scripts/build-skia.sh') }}

      - name: Build Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: scripts/build-skia.sh third_party/skia

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DSKIA_DIR=third_party/skia
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_INSTALL_PREFIX=/opt/drav
          -DDRAV_PACKAGE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        run: |
          cpack --config build/CPackConfig.cmake -B build/package
          dpkg-deb --info build/package/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: drav-deb-ubuntu-24.04
          path: build/package/*.deb
          if-no-files-found: error

  # Installs the package on a clean Ubuntu 24.04 to catch missing dependencies or bundled files.
  smoke-test:
    needs: deb-ubuntu-24-04
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: drav-deb-ubuntu-24.04

      - name: Install package
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./drav_*.deb xvfb xauth libgl1-mesa-dri

      - name: Launch and screenshot
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" drav --screenshot shot.png
          test -s shot.png

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshot
          path: shot.png
